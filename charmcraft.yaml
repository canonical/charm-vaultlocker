# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: vaultlocker
title: Vaultlocker
summary: Manage local block-device encryption with Vaultlocker and Vault.
description: |
  Vaultlocker is a subordinate machine charm for managing encryption and unlocking
  of local block devices.

  It integrates with Vault through the vault-kv relation to store and
  retrieve encryption keys.


# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
subordinate: true

platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6

provides:
  encrypted-device:
    interface: encrypted-device
    scope: container

requires:
  juju-info:
    interface: juju-info
    scope: container
  vault-kv:
    interface: vault-kv
    limit: 1

charm-libs:
  - lib: vault_k8s.vault_kv
    version: "0"

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
